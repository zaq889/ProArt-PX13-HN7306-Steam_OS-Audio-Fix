# Use case Configuration for sof-soundwire card
# ASUS ProArt PX13 (HN7306EA) TAS2783 SoundWire smart-amp speaker profile.
# This machine's SteamOS kernel exposes only volume controls for the two
# tas2783 amps (no "Speaker Switch", no "Amp Playback Switch"), so the
# EnableSequence just opens the machine-driver DAPM switches and sets full
# digital volume; the default state already plays, so keep it minimal.

SectionDevice."Speaker" {
        Comment "Speaker"

        EnableSequence [
                cset "name='Left Spk Switch' on"
                cset "name='Left Spk2 Switch' on"
                cset "name='Right Spk Switch' on"
                cset "name='Right Spk2 Switch' on"
                cset "name='tas2783-1 Speaker Volume' 200"
                cset "name='tas2783-2 Speaker Volume' 200"
        ]

        DisableSequence [
        ]

        Value {
                PlaybackPriority 100
                PlaybackPCM "hw:${CardId},2"
                PlaybackChannels 2
        }
}